name = "srfffm-calendar"
main = "src/index.js"
compatibility_date = "2026-09-01"

# Secret (never committed): the AEM admin API key with the "publish" role.
#   wrangler secret put AEM_ADMIN_API_KEY

[triggers]
crons = ["*/15 * * * *"]

[vars]
ICS_URL = "https://calendar.google.com/calendar/ical/c2381c2045fb161b04fa0c62c08075e6bd3d67ff8236ac1497ed835d7f0e8c42%40group.calendar.google.com/public/basic.ics"
# Public URL of this worker on the benpeter workers.dev subdomain (used for the per-event .ics links).
PUBLIC_URL = "https://srfffm-calendar.benpeter.workers.dev"
AEM_ORG = "bp-cq"
AEM_SITE = "srfffm"
AEM_REF = "main"
PAGES = "/de/services,/en/services"

# Create with: wrangler kv namespace create CALENDAR_STATE (then paste the returned id).
[[kv_namespaces]]
binding = "CALENDAR_STATE"
id = "4ec7378c39734318a9958957f6ee11d1"

[observability]
enabled = true
